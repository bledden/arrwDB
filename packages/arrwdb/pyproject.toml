[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arrwdb"
version = "0.2.0"
description = "Python SDK for arrwDB - Production Vector Database with 9 novel features"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [
    {name = "Blake Ledden", email = "blake.ledden@gmail.com"}
]
maintainers = [
    {name = "Blake Ledden", email = "blake.ledden@gmail.com"}
]
keywords = [
    "vector-database",
    "embeddings",
    "semantic-search",
    "rag",
    "retrieval-augmented-generation",
    "ai",
    "machine-learning",
    "hnsw",
    "similarity-search"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
requires-python = ">=3.9"
dependencies = [
    "requests>=2.28.0",
    "typing-extensions>=4.0.0",
]

[project.optional-dependencies]
async = [
    "aiohttp>=3.8.0",
    "websockets>=11.0",
]
langchain = [
    "langchain-core>=0.1.0",
]
llamaindex = [
    "llama-index-core>=0.10.0",
]
postgres = [
    "psycopg[binary]>=3.1",
]
all-integrations = [
    "langchain-core>=0.1.0",
    "llama-index-core>=0.10.0",
    "psycopg[binary]>=3.1",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "types-requests>=2.28.0",
]

[project.urls]
Homepage = "https://github.com/bledden/arrwDB"
Documentation = "https://github.com/bledden/arrwDB/blob/main/docs/API_GUIDE.md"
Repository = "https://github.com/bledden/arrwDB"
Issues = "https://github.com/bledden/arrwDB/issues"
Changelog = "https://github.com/bledden/arrwDB/blob/main/CHANGELOG.md"

[project.scripts]
arrwdb = "arrwdb.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["arrwdb*"]

[tool.setuptools.package-data]
arrwdb = ["py.typed"]

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311', 'py312']

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

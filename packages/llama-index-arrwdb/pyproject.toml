[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llama-index-vector-stores-arrwdb"
version = "0.1.0"
description = "LlamaIndex integration for arrwDB vector database"
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "Blake Ledden", email = "blake.ledden@gmail.com" }
]
keywords = ["llama-index", "llamaindex", "vector-database", "arrwdb", "embeddings", "ai", "llm", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = [
    "llama-index-core>=0.10.0",
    "arrwdb>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[project.urls]
Homepage = "https://github.com/bledden/arrwDB"
Documentation = "https://github.com/bledden/arrwDB/blob/main/docs/LLAMAINDEX_INTEGRATION.md"
Repository = "https://github.com/bledden/arrwDB"
Issues = "https://github.com/bledden/arrwDB/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["llama_index_arrwdb*"]

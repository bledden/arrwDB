# Build with native CPU optimizations — enables AVX2/FMA/AVX-512
# on x86_64 and NEON on ARM. Critical for distance computation performance.
[target.'cfg(target_arch = "x86_64")']
rustflags = ["-C", "target-cpu=native"]

[target.'cfg(target_arch = "aarch64")']
rustflags = ["-C", "target-cpu=native"]
